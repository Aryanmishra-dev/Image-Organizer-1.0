scan:
  file_types: [images, documents, videos, all]
  max_file_size_mb: 500
  ignore_patterns: [".git", "node_modules", ".DS_Store"]

hashing:
  algorithm: phash
  similarity_threshold: 10
  exact_hash: sha256

database:
  path: ~/.duplicate-image-detector/cache.db

performance:
  max_workers: 8
  batch_size: 1000
  enable_cache: true

safety:
  backup_before_delete: true
  backup_location: ~/.dupclean_backup
  keep_backup_days: 30
  require_confirmation: true
