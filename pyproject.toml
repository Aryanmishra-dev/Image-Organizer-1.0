[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-organizer"
version = "2.0.0"
description = "AI-powered duplicate image detection and intelligent file organization for macOS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Theo Engineer"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
keywords = ["duplicate", "image", "organizer", "deduplication", "macos", "apple-silicon"]
dependencies = [
    "click>=8.1.7",
    "PyQt6>=6.6.1",
    "Pillow>=10.2.0",
    "imagehash>=4.3.1",
    "xxhash>=3.4.1",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "bandit>=1.7.7",
    "safety>=3.0.0",
    "pre-commit>=3.6.0",
    "types-PyYAML>=6.0.0",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
image-organizer = "cli.commands:app"

[project.urls]
Homepage = "https://github.com/theogengineer/Image-Organizer-1.0"
Repository = "https://github.com/theogengineer/Image-Organizer-1.0"
Documentation = "https://github.com/theogengineer/Image-Organizer-1.0/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/theogengineer/Image-Organizer-1.0/issues"

# ── Ruff (linter + formatter) ───────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (Click uses this)
    "SIM108", # ternary operator
    "N802",   # function name should be lowercase (PyQt overrides)
    "N803",   # argument name should be lowercase (PyQt overrides)
    "N806",   # variable in function should be lowercase
    "A003",   # class attribute shadowing builtin
    "TC001",  # avoid import-shuffling churn for first-party imports
    "TC003",  # avoid import-shuffling churn for stdlib imports
    "RUF002", # allow typographic dashes in test docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["core", "cli", "gui", "utils"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM300"]
"src/gui/*" = ["N802", "N803", "N806"]

# ── Black (formatter) ───────────────────────────────────────────────────────
[tool.black]
target-version = ["py311"]
line-length = 100

# ── MyPy (static type checking) ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external resources",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = [
    "src/gui/*",
    "src/__init__.py",
    "src/cli/__init__.py",
    "src/core/__init__.py",
    "src/utils/__init__.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ── Bandit (security) ───────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert used in tests

# ── Setuptools ───────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]
